<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fin-modal-table-select main image</title>
<style>
    /* Filament plugin main image — flat, icon-only, 16:9.
       Render at 2560x1440: see art/README.md. */
    * { margin: 0; padding: 0; }

    html, body { width: 2560px; height: 1440px; overflow: hidden; }

    body {
        background: #111827;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    svg { width: 680px; height: 680px; }
</style>
</head>
<body>
    <svg viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- modal window frame -->
        <rect x="58" y="74" width="396" height="364" rx="36" stroke="#F9FAFB" stroke-width="22"/>

        <!-- header divider -->
        <line x1="69" y1="158" x2="443" y2="158" stroke="#F9FAFB" stroke-width="20"/>

        <!-- window dot (amber, top-left) -->
        <circle cx="112" cy="116" r="15" fill="#EBB304"/>

        <!-- row 1: unchecked -->
        <rect x="106" y="198" width="38" height="38" rx="9" stroke="#6B7280" stroke-width="14"/>
        <line x1="180" y1="217" x2="404" y2="217" stroke="#6B7280" stroke-width="16" stroke-linecap="round"/>

        <!-- row 2: selected (amber bar + check + text line) -->
        <rect x="92" y="262" width="328" height="66" rx="16" fill="#EBB304"/>
        <path d="M116 295 L134 313 L166 279" stroke="#111827" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="196" y1="295" x2="392" y2="295" stroke="#111827" stroke-width="16" stroke-linecap="round"/>

        <!-- row 3: unchecked -->
        <rect x="106" y="356" width="38" height="38" rx="9" stroke="#6B7280" stroke-width="14"/>
        <line x1="180" y1="375" x2="404" y2="375" stroke="#6B7280" stroke-width="16" stroke-linecap="round"/>

        <!-- check badge overlapping the corner: bg-colored halo ring keeps it flat -->
        <circle cx="440" cy="424" r="96" fill="#111827"/>
        <circle cx="440" cy="424" r="76" fill="#EBB304"/>
        <path d="M404 424 L430 450 L478 398" stroke="#111827" stroke-width="21" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
</body>
</html>
