name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  filament:
    name: ${{ matrix.package }} | PHP ${{ matrix.php }} / Filament ${{ matrix.filament }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [fin-avatar, fin-codex, fin-mail, fin-modal-table-select, fin-sentinel]
        php: ['8.2', '8.3']
        filament: ['^4.0', '^5.0']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        working-directory: packages/${{ matrix.package }}
        run: |
          composer require "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
          composer update --no-interaction --prefer-dist

      - name: Run tests
        working-directory: packages/${{ matrix.package }}
        run: vendor/bin/pest

  laravel:
    name: ${{ matrix.package }} | PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}${{ matrix.database && format(' / {0}', matrix.database) || '' }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      # One include block per lin-* package; duplicate the five rows when the next lin-* package arrives.
      matrix:
        include:
          - { package: lin-codex, php: '8.3', laravel: '^13.0', testbench: '^11.0' }
          - { package: lin-codex, php: '8.4', laravel: '^13.0', testbench: '^11.0' }
          - { package: lin-codex, php: '8.2', laravel: '^12.0', testbench: '^10.0' }
          - { package: lin-codex, php: '8.3', laravel: '^12.0', testbench: '^10.0' }
          - { package: lin-codex, php: '8.2', laravel: '^11.0', testbench: '^9.0', experimental: true }
          - { package: lin-codex, php: '8.3', laravel: '^13.0', testbench: '^11.0', database: mysql }
          - { package: lin-codex, php: '8.3', laravel: '^13.0', testbench: '^11.0', database: pgsql }
          - { package: lin-codex, php: '8.3', laravel: '^12.0', testbench: '^10.0', livewire: '^3.0' }
    services:
      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8.4' || '' }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: lin_codex
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      pgsql:
        image: ${{ matrix.database == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_DB: lin_codex
          POSTGRES_USER: codex
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        working-directory: packages/${{ matrix.package }}
        run: |
          composer update --no-interaction --prefer-dist \
            --with "illuminate/contracts:${{ matrix.laravel }}" \
            --with "livewire/livewire:${{ matrix.livewire || '^4.0' }}" \
            --with "orchestra/testbench:${{ matrix.testbench }}"

      - name: Run tests
        working-directory: packages/${{ matrix.package }}
        env:
          DB_CONNECTION: ${{ matrix.database || 'sqlite' }}
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ matrix.database == 'pgsql' && '5432' || '3306' }}
          DB_DATABASE: lin_codex
          DB_USERNAME: ${{ matrix.database == 'pgsql' && 'codex' || 'root' }}
          DB_PASSWORD: ${{ matrix.database == 'pgsql' && 'password' || '' }}
          CODEX_SEARCH_ENGINE: ${{ matrix.database && 'fulltext' || 'like' }}
        run: vendor/bin/pest
