name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  filament:
    name: ${{ matrix.package }} | PHP ${{ matrix.php }} / Filament ${{ matrix.filament }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [fin-avatar, fin-codex, fin-mail, fin-modal-table-select, fin-sentinel]
        php: ['8.2', '8.3']
        filament: ['^4.0', '^5.0']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        working-directory: packages/${{ matrix.package }}
        run: |
          composer require "filament/filament:${{ matrix.filament }}" --no-interaction --no-update
          composer update --no-interaction --prefer-dist

      - name: Run tests
        working-directory: packages/${{ matrix.package }}
        run: vendor/bin/pest

  laravel:
    name: ${{ matrix.package }} | PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      # One include block per lin-* package; duplicate the five rows when the next lin-* package arrives.
      matrix:
        include:
          - { package: lin-codex, php: '8.3', laravel: '^13.0', testbench: '^11.0' }
          - { package: lin-codex, php: '8.4', laravel: '^13.0', testbench: '^11.0' }
          - { package: lin-codex, php: '8.2', laravel: '^12.0', testbench: '^10.0' }
          - { package: lin-codex, php: '8.3', laravel: '^12.0', testbench: '^10.0' }
          - { package: lin-codex, php: '8.2', laravel: '^11.0', testbench: '^9.0', experimental: true }
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        working-directory: packages/${{ matrix.package }}
        run: |
          composer require "illuminate/contracts:${{ matrix.laravel }}" --no-interaction --no-update
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --no-interaction --prefer-dist

      - name: Run tests
        working-directory: packages/${{ matrix.package }}
        run: vendor/bin/pest
